{% set subjects = metadata.get('subject_added_entry_corporate_name') %}
{% if subjects %}
<span class="label">{{_('Subjects')}}</span>
<div class="top-bottom-padded">
  {%- for keyword, value in subjects %}
  <span class="label label-keyword">{{ value }}</span>
  {%- endfor %}
</div>
{% endif %}
